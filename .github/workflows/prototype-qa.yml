name: Portfolio design prototypes
on:
  pull_request:
    paths:
      - 'prototypes/**'
      - '.github/workflows/prototype-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.56.1 axe-core@4.10.3
          npx playwright install --with-deps chromium
      - name: Render actual prototypes and check responsive behavior
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/prototype-http.log 2>&1 &
          sleep 2
          node prototypes/compare.mjs
      - name: Bundle self-contained prototypes
        if: always()
        run: |
          mkdir -p prototype-previews
          zip -q -r prototype-previews/working-prototypes.zip prototypes michael-steurer-portrait.webp Michael_Steurer_Resume.pdf -x 'prototypes/compare.mjs'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-style-prototypes
          path: prototype-previews/
